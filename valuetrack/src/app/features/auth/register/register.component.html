<div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">
  <div class="card p-4 shadow" style="width: 100%; max-width: 400px;">
    <h3 class="text-center mb-3">Sign Up</h3>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input id="username" formControlName="username" class="form-control" autocomplete="off">
        <div class="text-danger" *ngIf="form.get('username')?.touched && form.get('username')?.invalid">
          Username is required.
        </div>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input id="email" formControlName="email" class="form-control" autocomplete="off">
        <div class="text-danger" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
          Enter a valid email.
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input id="password" type="password" formControlName="password" class="form-control">
        <div class="text-danger" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
          Password must be at least 6 characters.
        </div>
      </div>

      <div class="text-danger mb-2" *ngIf="errorMessage">{{ errorMessage }}</div>

      <button class="btn btn-primary w-100" type="submit" [disabled]="form.invalid">Register</button>
    </form>

    <div class="mt-3 text-center">
      Already have an account? <a routerLink="/">Login</a>
    </div>
  </div>
</div>
